name: Director IR Contract

on:
  push:
    branches: [main]
    paths:
      - 'prototype/**'
      - 'tests/test_director_to_motion.py'
      - 'tests/test_semantic_pipeline.py'
      - 'schemas/**'
      - 'examples/director-ir.sample.json'
      - '.github/workflows/director-ir-contract.yml'
  pull_request:
    paths:
      - 'prototype/**'
      - 'tests/test_director_to_motion.py'
      - 'tests/test_semantic_pipeline.py'
      - 'schemas/**'
      - 'examples/director-ir.sample.json'
      - '.github/workflows/director-ir-contract.yml'

jobs:
  director-ir-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run Director IR and semantic pipeline tests
        run: python -m pytest -q tests/test_director_to_motion.py tests/test_semantic_pipeline.py
